name: Profile stats

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python3 .github/scripts/profile_stats.py dist

      - name: Publish to the output branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "Helincharm"
          git config user.email "264269336+Helincharm@users.noreply.github.com"
          git add github-stats.svg stack.svg streak.svg
          git commit -q -m "Update profile stats"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
