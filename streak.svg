<svg xmlns="http://www.w3.org/2000/svg" width="560" height="196" viewBox="0 0 560 196" role="img" aria-label="GitHub contribution streak">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#EADDEF"/>
      <stop offset="1" stop-color="#BA9BF8"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.92" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#7030EF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7030EF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EADDEF"/>
      <stop offset="1" stop-color="#A087FD"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7030EF"/>
      <stop offset="1" stop-color="#DB1FFF"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.6); } }
    .fade { animation: fadeIn 0.6s ease-out both; }
    .slide { animation: slideIn 0.6s ease-out both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: popIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @keyframes streakDraw { from { stroke-dashoffset: 251.3; } }
    .streak { animation: streakDraw 0.9s ease-out 0.3s both; }
  </style>
  <rect x="0.5" y="0.5" width="559" height="195" rx="14" fill="#090820" stroke="#7030EF" stroke-opacity="0.28"/>
  <rect x="0.5" y="0.5" width="559" height="195" rx="14" fill="url(#haze)"/>
  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
    <text x="93.3" y="92" text-anchor="middle" font-size="32" font-weight="700" fill="url(#figure)" class="fade" style="animation-delay: 0.30s">31</text>
    <text x="93.3" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#EADDEF" class="fade" style="animation-delay: 0.40s">Total Contributions</text>
    <text x="93.3" y="150" text-anchor="middle" font-size="12" fill="#EADDEF" fill-opacity="0.65" class="fade" style="animation-delay: 0.50s">Feb 26, 2026 - Present</text>
    <line x1="186.7" y1="38" x2="186.7" y2="158" stroke="#BA9BF8" stroke-opacity="0.22" class="fade" style="animation-delay: 0.20s"/>
    <line x1="373.3" y1="38" x2="373.3" y2="158" stroke="#BA9BF8" stroke-opacity="0.22" class="fade" style="animation-delay: 0.20s"/>
    <circle cx="280.0" cy="78" r="40" fill="none" stroke="url(#ring)" stroke-width="5" stroke-dasharray="251.3" transform="rotate(-90 280.0 78)" class="streak"/>
    <circle cx="280.0" cy="38" r="11" fill="#090820"/>
    <g class="pop" style="animation-delay: 1.10s"><path d="M280.0 28c3.2 3.6 7 6.6 7 11.2a7 7 0 0 1-14 0c0-2.6 1.2-4.4 2.8-5.9.2 1.8 1 3 2.3 3.6-.4-3.4.3-6.2 1.9-8.9Z" fill="url(#ring)"/></g>
    <text x="280.0" y="88" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF" class="pop" style="animation-delay: 0.70s">0</text>
    <text x="280.0" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#BA9BF8" class="fade" style="animation-delay: 0.90s">Current Streak</text>
    <text x="280.0" y="170" text-anchor="middle" font-size="12" fill="#EADDEF" fill-opacity="0.65" class="fade" style="animation-delay: 1.00s">Oct 3</text>
    <text x="466.7" y="92" text-anchor="middle" font-size="32" font-weight="700" fill="url(#figure)" class="fade" style="animation-delay: 1.20s">2</text>
    <text x="466.7" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#EADDEF" class="fade" style="animation-delay: 1.30s">Longest Streak</text>
    <text x="466.7" y="150" text-anchor="middle" font-size="12" fill="#EADDEF" fill-opacity="0.65" class="fade" style="animation-delay: 1.40s">Sep 16 - Sep 17</text>
  </g>
</svg>
